name: Release

# Pushing a tag such as v0.2.1 builds the binaries and publishes a GitHub
# release, using that version's section of CHANGELOG.md as the notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # The newest 1.26 patch release, so builds and govulncheck always
          # include the latest standard library security fixes.
          go-version: '1.26.x'
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version. Add one before tagging."
            exit 1
          fi
          {
            echo
            echo "Each archive contains as2d, as2send and as2keygen, plus the README, LICENSE, CHANGELOG, systemd unit and example configuration. Check downloads against \`SHA256SUMS\`."
            echo
            echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
          } >> release-notes.md
          cat release-notes.md

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
